name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/misc/Gemfile
      # Install exactly misc/Gemfile.lock, and fail rather than re-resolve.
      BUNDLE_FROZEN: "true"
      # Install every gem from its source gem, as Katana OnDemand does. Only
      # sqlite3 has precompiled builds, which Bundler picked without this
      # (run 45107464826).
      BUNDLE_FORCE_RUBY_PLATFORM: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12" # Katana OnDemand 4.2.5-1's Ruby
          bundler-cache: true

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Smoke and browser tests
        run: bundle exec misc/tests/run
